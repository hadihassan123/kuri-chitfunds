services:
  # Backend Service
  - type: web
    name: kuri-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kuri-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*" # Update this to your frontend URL after deployment

  # Frontend Service
  - type: web
    name: kuri-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: kuri-backend
          property: host

databases:
  - name: kuri-db
    plan: free # Use Render's free tier for PostgreSQL
